services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    # Serve only the demo database: no database picker at login, and PDF reports can load
    # their stylesheets (the test database vme_test sits next to it).
    command: ["--db-filter=^vme_demo$"]
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  # HTTPS for the Outlook add-in (Outlook only loads add-ins over https): https://localhost:8443.
  # Optional: docker compose --profile outlook up -d. See docs/dev/outlook.md for trusting the certificate.
  https:
    image: caddy:2
    profiles: ["outlook"]
    depends_on:
      - odoo
    ports:
      - "8443:8443"
    volumes:
      - ./tools/outlook/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  caddy-data:
